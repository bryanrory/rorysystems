name: Publicar landing no GitHub Pages

# Publica apps/landing — o resto do repositório (futuros apps) fica
# fora do site. Roda a cada push em master que mexa nessa pasta, ou
# manualmente pela aba Actions.
#
# Os subdiretórios de clientes vêm de repositórios próprios e são
# baixados em tempo de build, então nada deles é commitado aqui e cada
# deploy publica a versão mais recente de cada um:
#   /pizzaria-tertulia  <- bryanrory/tertulia-pizzaria-landing
#   /oficina_dos_guri   <- bryanrory/oficina_dos_guri
on:
  push:
    branches: [master]
    paths:
      - apps/landing/**
      - .github/workflows/deploy-landing.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Baixar landing da Pizzaria Tertúlia
        uses: actions/checkout@v4
        with:
          repository: bryanrory/tertulia-pizzaria-landing
          path: _tertulia-pizzaria-landing

      - name: Baixar landing da Oficina Dos Guri
        uses: actions/checkout@v4
        with:
          repository: bryanrory/oficina_dos_guri
          path: _oficina-dos-guri

      - name: Montar site publicado
        run: |
          mkdir -p _site
          cp -r apps/landing/. _site/
          mkdir -p _site/pizzaria-tertulia
          cp -r _tertulia-pizzaria-landing/. _site/pizzaria-tertulia/
          rm -rf _site/pizzaria-tertulia/.git
          mkdir -p _site/oficina_dos_guri
          cp -r _oficina-dos-guri/. _site/oficina_dos_guri/
          rm -rf _site/oficina_dos_guri/.git

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
