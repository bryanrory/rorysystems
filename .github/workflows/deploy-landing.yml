name: Publicar landing no GitHub Pages

# Publica apenas apps/landing — o resto do repositório (futuros apps) fica
# fora do site. Roda a cada push em master que mexa nessa pasta, ou
# manualmente pela aba Actions.
on:
  push:
    branches: [master]
    paths:
      - apps/landing/**
      - .github/workflows/deploy-landing.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing
      - id: deployment
        uses: actions/deploy-pages@v4
